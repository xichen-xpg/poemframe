name: Daily Poem Poster

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily poem poster
        run: npm run generate:daily-poem
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POEM_WORKS: "月下独酌"
          UPDATE_DAILY_OUTPUT: "1"

      - name: Commit and push poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.png"
          if git diff --cached --quiet; then
            echo "No poster changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily poem poster $(TZ=Asia/Dubai date +%F)"
          git push
